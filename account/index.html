<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Account — PlayGonu</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/styles/main.css">
<style>
  body { background: var(--paper, #F6F1E6); }
  .acct { max-width: 460px; margin: 0 auto; padding: 40px 16px 80px; display: flex; flex-direction: column; gap: 18px; }
  .acct h1 { margin: 0; font-size: 26px; }
  .acct-card { background: #fff; border: 1.5px solid var(--card-border, #E2D5B8); border-radius: 16px; padding: 22px; display: flex; flex-direction: column; gap: 14px; }
  .acct-card h2 { margin: 0; font-size: 18px; }
  .acct label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .acct label.check { flex-direction: row; align-items: flex-start; gap: 8px; font-weight: 600; line-height: 1.5; }
  .acct label.check input { width: 18px; height: 18px; margin: 1px 0 0; flex: none; }
  .acct input[type=text], .acct input[type=email], .acct input[type=password] { font: inherit; font-size: 15px; padding: 10px 12px; border: 1.5px solid var(--card-border, #E2D5B8); border-radius: 10px; background: #fff; color: var(--ink); width: 100%; box-sizing: border-box; }
  .acct .hint { font-size: 12.5px; color: var(--muted); font-weight: 500; }
  .acct .msg { font-size: 14px; font-weight: 700; min-height: 0; }
  .acct .msg:empty { display: none; }
  .acct .msg.err { color: var(--red); }
  .acct .msg.ok { color: var(--teal, #2F6E6A); }
  .acct .links { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13.5px; }
  .acct .links button, .acct .linkish { all: unset; cursor: pointer; color: var(--ink-soft); text-decoration: underline; font-size: 13.5px; }
  .acct .consent { font-size: 12.5px; line-height: 1.65; color: var(--muted); background: var(--paper-deep, #FBF7EE); border-radius: 10px; padding: 10px 12px; }
  .acct .consent a { color: inherit; }
  .acct table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .acct th, .acct td { padding: 8px 6px; text-align: center; border-bottom: 1px solid #EEE6D6; }
  .acct th:first-child, .acct td:first-child { text-align: left; }
  .acct th { font-size: 12px; color: var(--muted); }
  .acct .row { display: flex; gap: 10px; align-items: flex-end; }
  .acct .row > :first-child { flex: 1; }
  .acct details summary { cursor: pointer; font-weight: 700; font-size: 14px; color: var(--ink-soft); }
  .acct details[open] summary { margin-bottom: 12px; }
  .acct .danger { color: var(--red); border-color: var(--red); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main class="acct">
  <a href="/" data-home class="serif" style="font-size:21px;font-weight:700;color:var(--ink);text-decoration:none;">PlayGonu</a>
  <div data-account-root><p class="hint">…</p></div>
</main>
<script type="module" src="/src/ui/account.js"></script>
</body>
</html>
