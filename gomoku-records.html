<body>
<div data-root>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" style="display:flex;align-items:baseline;gap:8px;">
        <span class="serif" style="font-size:21px;font-weight:700;color:var(--ink);">PlayGonu</span>
      </a>
      <nav style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <a href="chamgonu.html" class="variant-tab">Cham-gonu</a>
        <span data-variant-menu></span>
        <a href="gomoku.html" class="variant-tab">Gomoku</a>
        <a href="gomoku-records.html" class="variant-tab is-active">Records</a>
        <a href="howto.html" class="variant-tab">How to Play</a>
        <a href="online.html" class="variant-tab">Online</a>
        <a href="blog/index.html" class="variant-tab">Blog</a>
        <span data-lang-switcher></span>
      </nav>
    </div>
  </header>

  <div class="main-layout">

    <div class="board-column">
      <h1 class="serif" style="margin:0;font-size:26px;text-align:center;">Gomoku game records</h1>
      <p style="margin:0;font-size:14.5px;line-height:1.6;color:var(--ink-soft);text-align:center;max-width:520px;">Replay your finished games move by move, and ask RAPFI — the Gomocup 2025 champion engine — where it would play at any point.</p>
      <div data-records-viewer style="width:100%;display:flex;flex-direction:column;gap:14px;align-items:center;"></div>
    </div>

    <div class="rules-panel">
      <div class="card" data-records-list style="padding:20px 24px;display:flex;flex-direction:column;gap:10px;"></div>
      <div><button type="button" class="btn" data-records-open-file></button><input type="file" accept=".psq,.txt,text/plain" data-records-file hidden></div>
      <div class="card" data-records-guide style="padding:24px;display:flex;flex-direction:column;gap:14px;"></div>
    </div>

  </div>

  <div data-records-flash role="status" style="position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;"></div>

  <footer style="max-width:1280px;margin:40px auto 0;padding:20px 40px;text-align:center;font-size:12px;color:var(--muted);">
    &copy; 2026 PlayGonu &middot; <a href="privacy.html" style="color:var(--muted);text-decoration:underline;">Privacy Policy</a>
  </footer>

</div>
<script type="module">
  import { mountGomokuRecords } from './src/ui/gomokuRecords.js';
  import { mountLanguageSwitcher } from './src/ui/languageSwitcher.js';
  import { mountVariantMenu } from './src/ui/variantMenu.js';
  mountGomokuRecords(document.querySelector('[data-root]'), { lang: 'en' });
  mountLanguageSwitcher(document.querySelector('[data-lang-switcher]'), { currentLang: 'en', currentPage: 'gomoku-records.html' });
  mountVariantMenu(document.querySelector('[data-variant-menu]'), { lang: 'en', currentPage: 'gomoku-records.html' });
</script>
