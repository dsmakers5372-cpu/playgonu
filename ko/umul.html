<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>플레이고누 — 우물고누 플레이</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;700&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../styles/main.css">
</head>
<body>
<div data-root>

  <header class="site-header">
    <div class="site-header__inner">
      <a href="index.html" style="display:flex;align-items:baseline;gap:8px;">
        <span class="serif" style="font-size:21px;font-weight:700;color:var(--ink);">PlayGonu</span>
      </a>
      <nav style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <a href="index.html" class="variant-tab">줄고누</a>
        <a href="umul.html" class="variant-tab is-active">우물고누</a>
        <a href="hobak.html" class="variant-tab">호박고누</a>
        <a href="pat.html" class="variant-tab">밭고누</a>
        <a href="howto.html" class="variant-tab">하는 법</a>
        <span data-lang-switcher></span>
      </nav>
    </div>
  </header>

  <div class="toolbar">
    <div class="toolbar__inner">
      <div style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div class="turn-indicator">
          <span class="turn-dot" data-turn-dot></span>
          <span data-turn-label>빨강 차례</span>
        </div>
        <span class="tag" data-timer>0:00</span>
        <div style="font-size:13px;color:var(--muted);">잡기 없음 — 상대를 가두면 승리</div>
      </div>
      <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap;">
        <select class="pill" data-side-select style="cursor:pointer;">
          <option value="A">빨강 · 선공</option>
          <option value="B">검정 · 후공</option>
        </select>
        <select class="pill" data-opponent-mode style="cursor:pointer;">
          <option value="local">2인 로컬</option>
          <option value="ai">AI와 대전</option>
        </select>
        <select class="pill" data-ai-difficulty style="cursor:pointer;">
          <option value="easy">쉬움</option>
          <option value="normal" selected>보통</option>
          <option value="hard">어려움</option>
          <option value="master">마스터</option>
        </select>
        <button class="btn" data-undo>되돌리기</button>
        <button class="btn-primary" data-new-game>새 게임</button>
      </div>
    </div>
  </div>

  <div class="main-layout">

    <div class="board-column">
      <div class="theme-row">
        <span class="tag">보드 색상</span>
        <div data-theme-row style="display:flex;gap:10px;"></div>
      </div>
      <div class="board-frame" data-board-frame>
        <svg data-board-svg viewBox="0 0 420 420" width="420" height="420"></svg>
      </div>
    </div>

    <div class="rules-panel">
      <div class="card" style="padding:24px;display:flex;flex-direction:column;gap:14px;">
        <div class="serif" style="font-size:18px;font-weight:700;">우물고누 규칙</div>
        <ul>
          <li>각자 말 2개로 시작합니다. 중앙의 "우물" 지점은 그려져 있지만 들어갈 수 없습니다.</li>
          <li>한 턴에 말 하나를 선을 따라 빈 점으로 한 칸 움직입니다.</li>
          <li>우물고누에는 잡기가 없습니다 — 말은 판에서 사라지지 않습니다.</li>
          <li>상대 말 두 개를 모두 못 움직이게 가두면 승리합니다.</li>
        </ul>
      </div>
    </div>

  </div>

  <div class="ad-slot">
    <div class="ad-slot__box">광고 자리</div>
  </div>

  <div class="win-banner" data-win-banner>
    <div class="win-banner__card">
      <div class="serif" style="font-size:22px;font-weight:700;" data-win-message>빨강 승리!</div>
      <div style="display:flex;justify-content:center;gap:32px;">
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <span class="tag">수</span>
          <span class="serif" style="font-size:20px;font-weight:700;" data-win-moves>0</span>
        </div>
        <div style="display:flex;flex-direction:column;align-items:center;gap:2px;">
          <span class="tag">시간</span>
          <span class="serif" style="font-size:20px;font-weight:700;" data-win-time>0:00</span>
        </div>
      </div>
      <button class="btn-primary" data-win-play-again>다시 하기</button>
      <a href="index.html" class="btn" style="text-align:center;">홈으로 돌아가기</a>
    </div>
  </div>

</div>
<script type="module">
  import { mountUmulgonuGame } from '../src/ui/umulgonuGame.js';
  import { mountLanguageSwitcher } from '../src/ui/languageSwitcher.js';
  mountUmulgonuGame(document.querySelector('[data-root]'), { lang: 'ko' });
  mountLanguageSwitcher(document.querySelector('[data-lang-switcher]'), { currentLang: 'ko', currentPage: 'umul.html' });
</script>
</body>
</html>
